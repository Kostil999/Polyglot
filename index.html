<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17202B">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Полиглот DE·FR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Полиглот">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: transit-map course — each unit is a "line", each lesson a station; app shell with sticky stats bar and bottom tabs */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#151D29; --muted:#5B6677; --rule:#D7DDE6; --soft:#E3E8EF;
  --de:#C7401F; --de-soft:#F7E2DB; --fr:#2A55D4; --fr-soft:#DEE6FA;
  --ok:#17905A; --ok-soft:#DDF3E7; --bad:#CF3636; --bad-soft:#FBE1E1; --gold:#E39A12;
  --gm:#2B63C9; --gf:#C8323C; --gn:#1F8A55; --gp:#6B7586;
  --en:#16806F; --en-soft:#D8F0EA;
  --acc:var(--de); --acc-soft:var(--de-soft);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#172029; --ink:#E7ECF3; --muted:#94A0B1; --rule:#2A3543; --soft:#202B37;
  --de:#F27A55; --de-soft:#3A221C; --fr:#7393F6; --fr-soft:#1E2847;
  --ok:#3CC483; --ok-soft:#173326; --bad:#F06A6A; --bad-soft:#3A1E21; --gold:#F2B33D; --gm:#7FA6F2; --gf:#F27D84; --gn:#58C98D; --gp:#9AA4B4; --en:#4CC2AE; --en-soft:#163530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#172029; --ink:#E7ECF3; --muted:#94A0B1; --rule:#2A3543; --soft:#202B37;
  --de:#F27A55; --de-soft:#3A221C; --fr:#7393F6; --fr-soft:#1E2847;
  --ok:#3CC483; --ok-soft:#173326; --bad:#F06A6A; --bad-soft:#3A1E21; --gold:#F2B33D; --gm:#7FA6F2; --gf:#F27D84; --gn:#58C98D; --gp:#9AA4B4; --en:#4CC2AE; --en-soft:#163530; color-scheme:dark}
:root.fr{--acc:var(--fr); --acc-soft:var(--fr-soft)}
:root.en{--acc:var(--en); --acc-soft:var(--en-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button b{font:700 11px var(--f-display);letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"] b{color:var(--acc)}
.stats{display:flex;gap:12px;font:700 14px var(--f-display);font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:4px}
.stat.fire{color:var(--gold)} .stat.xp{color:var(--acc)} .stat.hp{color:var(--bad)}
.stat.off{color:var(--muted)}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* goal + banner */
.goal{background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:8px;margin-top:6px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal-row b{font:600 15px var(--f-body)}
.goal-row span{font:700 13px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .4s}
.banner{margin-top:10px;border-radius:14px;padding:12px 14px;background:var(--acc-soft);display:flex;gap:10px;align-items:center;font-size:15px}
.banner svg{color:var(--acc)}

/* levels & lines */
.level{margin-top:26px}
.lvl-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.lvl-code{font:700 30px/1 var(--f-display);color:var(--acc);letter-spacing:-.02em}
.lvl-head div{display:grid}
.lvl-head b{font-weight:600}
.lvl-head small{color:var(--muted);font-size:13px}
.unit{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:12px}
.unit-head{display:grid;gap:4px}
.chip{justify-self:start;font:700 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--acc);color:#fff}
.unit h3{margin:4px 0 0;font:600 19px/1.25 var(--f-body);text-wrap:balance}
.preview{margin:0;color:var(--muted);font-size:14px}
.tip{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
.tip summary{font-size:14px;font-weight:600;color:var(--acc);cursor:pointer;list-style:none;padding:4px 0}
.tip summary::-webkit-details-marker{display:none}
.tip summary::after{content:" ＋"} .tip[open] summary::after{content:" －"}
.tip p{margin:6px 0 2px;font-size:15px;max-width:60ch}
.stops{margin-top:12px;display:grid}
.stop{display:flex;align-items:center;gap:14px;text-align:left;padding:8px 0;position:relative;min-height:58px;width:100%}
.stop::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:6px;background:var(--soft)}
.stop:first-child::before{top:50%} .stop:last-child::before{bottom:50%}
.stop.done::before{background:var(--acc)}
.dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface);border:6px solid var(--soft)}
.stop.done .dot{background:var(--acc);border-color:var(--acc);color:#fff}
.stop.next .dot{border-color:var(--acc)}
.stop.rec .dot{box-shadow:0 0 0 5px var(--acc-soft)}
.dot svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.stop .txt{flex:1;min-width:0;display:grid}
.stop .txt b{font-weight:600}
.stop .txt small{color:var(--muted);font-size:13px}
.go{font:700 12px var(--f-display);letter-spacing:.03em;background:var(--acc);color:#fff;padding:9px 12px;border-radius:10px}
.stop.done .go{background:var(--soft);color:var(--muted)}
.stop.locked{cursor:default}
@media (prefers-reduced-motion:no-preference){.stop.rec .dot{animation:pulse 2s infinite}}
.stop.next .go{background:var(--acc-soft);color:var(--acc)} .stop.rec .go{background:var(--acc);color:#fff}
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:8px 14px;border-radius:20px;background:var(--surface);font-weight:600;font-size:14px;color:var(--muted);border:1px solid var(--rule)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daily{margin-top:10px;background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:10px;border:2px solid var(--acc)}
.daily.calm{border-color:transparent}
.daily .goal-row b{display:flex;gap:8px;align-items:center}
.daily .goal-row b svg{color:var(--acc)}
.daily p{margin:0;font-size:14px;color:var(--muted)}
.box{font:700 11px var(--f-display);color:var(--muted);background:var(--soft);padding:4px 8px;border-radius:8px;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 9px var(--acc-soft)}}

/* cards / generic */
.h2{font:700 20px/1.2 var(--f-display);margin:22px 0 10px;letter-spacing:-.01em}
.card{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:10px}
.card p{margin:0}
.muted{color:var(--muted)}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:16px;background:var(--acc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 70%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 70%,#000)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn:disabled{background:var(--soft);color:var(--muted);box-shadow:none;cursor:default;transform:none}
.list{display:grid;gap:0;background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .w{flex:1;min-width:0}
.row .w b{display:block;font-weight:600}
.row .w span{color:var(--muted);font-size:14px}
.cnt{font:700 12px var(--f-display);color:var(--bad);background:var(--bad-soft);padding:4px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.say{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--acc);background:var(--acc-soft);flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px 12px;display:grid;gap:2px}
.tile b{font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;position:relative;padding-top:18px}
.wcol{display:grid;justify-items:center;gap:6px;height:100%;grid-template-rows:1fr auto}
.wbar{width:100%;max-width:34px;align-self:end;border-radius:8px 8px 4px 4px;background:var(--soft);position:relative;min-height:4px}
.wbar.hit{background:var(--acc)}
.wbar em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:700 11px var(--f-display);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.wcol small{font-size:12px;color:var(--muted)}
.wcol.today small{color:var(--ink);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:12px;background:var(--soft);font-weight:600;font-size:15px}
.opt[aria-pressed="true"]{background:var(--acc);color:#fff}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field input[type=time]{font:600 17px var(--f-body);padding:8px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.switch{width:52px;height:32px;border-radius:16px;background:var(--soft);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch[aria-checked="true"]{background:var(--ok)} .switch[aria-checked="true"]::after{left:23px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.danger{color:var(--bad);font-weight:600;padding:12px 0;text-align:left}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:2px;padding:9px 4px 8px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--acc)}

/* lesson overlay */
#lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#lesson[hidden]{display:none!important}
.l-head{display:flex;align-items:center;gap:12px;padding-block:12px}
.x{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.x svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round}
.l-head .bar{flex:1;height:14px;border-radius:8px;background:var(--rule)}
.l-body{flex:1;overflow-y:auto;padding-block:10px 20px;display:flex;flex-direction:column;gap:18px}
.l-body .wrap{width:100%}
.label{font:700 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.prompt{font:600 25px/1.3 var(--f-body);margin:6px 0 0;text-wrap:balance}
.prompt-row{display:flex;gap:12px;align-items:center;margin-top:6px}
.prompt-row .prompt{margin:0}
.choices{display:grid;gap:10px}
.choice{text-align:left;padding:15px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--rule);font-size:17px;font-weight:500;box-shadow:0 2px 0 var(--rule)}
.choice[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.big-say{display:flex;gap:12px;justify-content:center;padding:10px 0}
.big-say button{width:84px;height:84px;border-radius:24px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 70%,#000)}
.big-say button.slow{width:60px;height:60px;align-self:end;background:var(--acc-soft);color:var(--acc);box-shadow:none;font:700 11px var(--f-display)}
.big-say svg{width:36px;height:36px}
.answer{min-height:62px;border-bottom:2px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.answer.lined{background:repeating-linear-gradient(to bottom,transparent 0 60px,var(--rule) 60px 62px);min-height:124px;border:0}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{padding:9px 13px;border-radius:12px;background:var(--surface);border:2px solid var(--rule);box-shadow:0 2px 0 var(--rule);font-size:17px;font-weight:500}
.tok.used{visibility:hidden}
.typein{width:100%;font:500 19px var(--f-body);padding:14px 16px;border-radius:14px;border:2px solid var(--rule);background:var(--surface);color:var(--ink)}
.typein:focus{border-color:var(--acc);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:40px;border-radius:10px;background:var(--soft);font-size:17px;font-weight:600}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start;min-width:0}
.pair{padding:14px 10px;border-radius:14px;background:var(--surface);border:2px solid var(--rule);box-shadow:0 2px 0 var(--rule);font-weight:500;font-size:15px;overflow-wrap:anywhere;min-height:56px}
.pair[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.pair.gone{opacity:.25;pointer-events:none;box-shadow:none}
.pair.shake{border-color:var(--bad);background:var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .35s}}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.l-foot{padding-block:14px;border-top:1px solid var(--rule)}
.l-foot.ok{background:var(--ok-soft);border-color:transparent}
.l-foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:grid;gap:4px;margin-bottom:12px}
.fb b{font:700 18px var(--f-display)}
.l-foot.ok .fb b{color:var(--ok)} .l-foot.bad .fb b{color:var(--bad)}
.fb span{font-size:16px}
.l-foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.l-foot.bad .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.center h2{font:700 28px/1.15 var(--f-display);margin:0;text-wrap:balance}
.center p{margin:0;color:var(--muted)}
.center .tiles .tile{text-align:center}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,15,22,.45);display:flex;align-items:flex-end}
.sheet .in{background:var(--surface);width:100%;max-width:540px;margin:0 auto;border-radius:22px 22px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h3{margin:0;font:700 20px var(--f-display)}
.sheet p{margin:0;color:var(--muted)}

/* teaching UI */
.art{font-weight:700} .g-m{color:var(--gm)} .g-f{color:var(--gf)} .g-n{color:var(--gn)} .g-pl{color:var(--gp)}
.pl{font-size:12px;font-weight:600;color:var(--gp);border:1px solid var(--rule);border-radius:6px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;margin:-4px 0 10px;font-size:13px;color:var(--muted)}
.rule{display:grid;gap:10px;font-size:15px;line-height:1.5}
.rule p{margin:0;max-width:62ch}
.rule b{font-weight:700}
.rex{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px 12px}
.rex>div{display:grid;gap:1px;min-width:0}
.rex>div>b{font-weight:600;overflow-wrap:anywhere}
.rex>div>span{color:var(--muted);font-size:14px}
.tip .rule{margin-top:8px}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none;margin:8px 4px 0 6px}
.say.sm{width:32px;height:32px;border-radius:10px}
.say.sm svg{width:17px;height:17px}
.learn{background:var(--surface);border-radius:22px;padding:26px 20px;display:grid;justify-items:center;gap:10px;text-align:center;border:2px solid var(--rule);box-shadow:0 3px 0 var(--rule)}
.say.big{width:64px;height:64px;border-radius:20px;background:var(--acc);color:#fff}
.say.big svg{width:30px;height:30px}
.lw{font:600 30px/1.2 var(--f-body);text-wrap:balance;overflow-wrap:anywhere}
.lw.phrase{font-size:24px}
.lt{font-size:18px;color:var(--muted)}
.gchip{font:700 11px var(--f-display);letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:8px;background:var(--soft)}
.lex{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px 14px}
.lex>div{display:grid;gap:2px;min-width:0}
.lex>div>b{font-weight:600}
.lex>div>span{color:var(--muted);font-size:14px}
.gapline{line-height:1.6}
.blank{display:inline-block;min-width:84px;border-bottom:3px solid var(--acc);color:var(--acc);text-align:center;padding:0 6px;margin:0 2px}
.blank.ok{color:var(--ok);border-color:var(--ok)} .blank.bad{color:var(--bad);border-color:var(--bad)}
.keys .hintbtn{background:var(--acc-soft);color:var(--acc);padding:0 12px;font-size:14px;margin-left:auto}
.fb small{font-size:13px;color:var(--muted)}
.fb-row{display:flex;gap:10px}
.fb-row .btn{flex:1}
.fb-row .rulebtn{flex:0 0 auto;width:auto;padding:0 16px;background:var(--surface)!important;color:var(--ink)!important;box-shadow:none!important}
.fb-row .rulebtn svg{width:18px;height:18px}
.sheet .in{max-height:88vh;overflow-y:auto}
.sheet-body p{margin:0 0 6px;color:var(--muted)}
.sheet-body .rule p{color:var(--ink)}

/* words, alphabet, conjugation */
.seg button span{display:none}
@media (min-width:560px){.seg button span{display:inline}}
.seg button{padding:7px 14px}
.conj{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:6px}

function srsSet(key, ok){ if (!ENTRY[S.lang][key]) return;
  const r = S.srs[S.lang][key] || { b:0 };
  r.b = ok ? Math.min(r.b + 1, 7) : 0;
  r.due = dayOff(INT[r.b]); S.srs[S.lang][key] = r; }

const flat = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/œ/g,'oe');

/* ---------- speech ---------- */
const canSpeak = 'speechSynthesis' in window;
const speakable = t => t.replace(/\+\s*(Akk|Dat|Gen)\.?/g,'').replace(/[→…]/g,',').replace(/\(.*?\)/g,'');
function say(text, slow){ if (!canSpeak) return; try{
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(speakable(text)); u.lang = C().voice; u.rate = slow ? .6 : .9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').startsWith(C().voice.slice(0,2)));
  if (v) u.voice = v; speechSynthesis.speak(u); } catch(e){} }
function sayQueue(list){ if (!canSpeak) return; try { speechSynthesis.cancel();
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').startsWith(C().voice.slice(0,2)));
  list.forEach(([t, rate]) => { const u = new SpeechSynthesisUtterance(t); u.lang = C().voice; u.rate = rate || .85; if (v) u.voice = v; speechSynthesis.speak(u); }); } catch(e){} }

/* ---------- sound effects (synthesized, no files) ---------- */
let AC = null;
function ac(){ try { if (!AC){ const K = window.AudioContext || window.webkitAudioContext; if (!K) return null; AC = new K(); }
  if (AC.state === 'suspended') AC.resume(); } catch(e){ return null; } return AC; }
function tone(f, t0, dur, type, vol, f2){ const a = ac(); if (!a) return; const t = a.currentTime + t0;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05); }
const SFX = {
  ok(){ if (!S.sfx) return; tone(880,0,.13,'sine',.22); tone(1318.5,.1,.32,'sine',.22); tone(2637,.1,.22,'sine',.03); },
  bad(){ if (!S.sfx) return; tone(196,0,.16,'triangle',.28,175); tone(147,.14,.32,'triangle',.28,123); },
  pair(){ if (!S.sfx) return; tone(1046.5,0,.12,'sine',.14); tone(1568,.06,.16,'sine',.1); },
  done(){ if (!S.sfx) return; [523.25,659.25,783.99,1046.5].forEach((f,i) => tone(f,i*.11,.32,'triangle',.18)); tone(1318.5,.46,.7,'sine',.16); },
  page(){ if (!S.sfx) return; tone(660,0,.06,'sine',.06); }
};

/* ---------- rule rendering ---------- */
function ruleHTML(u){
  let h = '', para = [];
  const flush = () => { if (para.length){ h += `<p>${para.map(bold).join('<br>')}</p>`; para = []; } };
  for (const line of u.rule.split('\n')){
    const t = line.trim(); if (!t) { flush(); continue; }
    if (t.startsWith('▸')){ flush();
      const cells = t.slice(1).split('|');
      h += `<div class="conj" style="grid-template-rows:repeat(${Math.ceil(cells.length/2)},auto)">${cells.map(x => x.trim()).map(x => `<button data-say="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
    } else if (t.startsWith('•')){ flush();
      const body = t.slice(1).trim(), i = body.indexOf(' — ');
      const tgt = i > 0 ? body.slice(0,i) : body, tr = i > 0 ? body.slice(i+3) : '';
      const cyr = !tr && /[А-Яа-яЁё]/.test(tgt);
      h += `<div class="rex">${cyr ? '<span class="rdot"></span>' : `<button class="say sm" data-say="${esc(tgt)}" aria-label="Произнести">${ICON.say}</button>`}<div><b>${bold(tgt)}</b>${tr ? `<span>${bold(tr)}</span>` : ''}</div></div>`;
    } else { flush(); para.push(t); flush(); }
  }
  flush(); return `<div class="rule">${h}</div>`;
}

function lastReminder(){ const now = new Date(), m = now.getHours()*60 + now.getMinutes();

function dailyCard(){
  const due = dueKeys().length, any = Object.keys(S.srs[S.lang]).length;

  if (due) return `<div class="daily"><div class="goal-row"><b>${ICON.rep}Повторение на сегодня</b><span>${due}</span></div>

}
function goalCard(){

function recommended(units){ for (const u of units){ const d = done(u); if (d < 3) return { id:u.id, li:d }; } return null; }
function renderPath(){
  const c = C(); let f = S.filter[S.lang];
  if (f !== 'all' && !c.levels.some(l => l.id === f)) f = S.filter[S.lang] = 'all';
  const levels = c.levels.filter(lv => f === 'all' || lv.id === f);
  let h = goalCard();
  h += `<div class="filters" role="group" aria-label="Раздел">${[['all','Все темы'], ...c.levels.map(l => [l.id, LVCHIP[l.id] || l.id])].map(([k,n]) =>
    `<button data-act="filter" data-v="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>`;
  const rec = recommended(levels.flatMap(lv => lv.units));
  let line = 0;
  for (const lv of c.levels){
    if (!levels.includes(lv)){ line += lv.units.length; continue; }
    const fin = lv.units.filter(u => done(u) >= 3).length;
    h += `<section class="level"><div class="lvl-head"><span class="lvl-code">${{PH:'Aa',GR:'Gr'}[lv.id] || lv.id}</span><div><b>${LV[lv.id]}</b><small>${LVSUB[lv.id] ? LVSUB[lv.id] + ' · ' : ''}${fin} из ${lv.units.length} тем пройдено</small></div></div>`;

    lv.units.forEach(u => {
      line++; const d = done(u);

        <p class="preview">${u.w.slice(0,4).map(x => esc(x[0])).join(' · ')} …</p></div>
        <details class="tip"><summary>Правило темы</summary>${ruleHTML(u)}</details><div class="stops">`;

      }
      h += `</div></article>`;
    });
    h += `</section>`;
  }
  $('#main').innerHTML = h;
}
function deckStat(d){ const n = d.w.filter(e => known(e[0])).length; return { n, total:d.w.length }; }

const mk = {

  listen:(e,pool) => canSpeak ? ({ t:'listen', e, k:e[0], ans:e[0], opts:shuffle([e[0], ...sample(pool.filter(x => x[0]!==e[0]),3).map(x=>x[0])]) }) : mk.rev(e,pool),
  type:e => ({ t:'type', e, k:e[0] }),
  match:list => ({ t:'match', list }),
  gap:g => ({ t:'gap', e:g, k:'g:'+g[0], ans:g[3], opts:shuffle([g[3], ...g[4]]) }),
  build:(e,sents) => { const tk = tokens(e[0]), low = tk.map(x => x.toLowerCase());

    return { t:'build', e, k:e[0], tk, bank:shuffle(tk.concat(extra)) }; },

const known = k => !!S.srs[S.lang][k];
function buildLesson(u, li){

  const L = e => known(e[0]) ? [] : [mk.learn(e, u, 'w')];
  const LS = e => known(e[0]) ? [] : [mk.learn(e, u, 's')];
  if (li === 0) return [mk.theory(u), ...L(W[0]), ...L(W[1]), mk.pick(W[0],W), mk.rev(W[1],W),
    ...L(W[2]), ...L(W[3]), ...L(W[4]), mk.match(W.slice(0,5)), mk.gap(G[0]), mk.listen(W[2],W), mk.type(W[3]), mk.pick(W[4],W), mk.build(Sx[0],Sx), mk.gap(G[1])];
  if (li === 1) return [...L(W[5]), ...L(W[6]), mk.pick(W[5],W), mk.rev(W[6],W),
    ...L(W[7]), ...L(W[8]), ...L(W[9]), mk.match(W.slice(5)), mk.gap(G[2]), mk.listen(W[7],W), mk.type(W[8]), mk.pick(W[9],W), mk.build(Sx[1],Sx), mk.build(Sx[2],Sx)];
  const ws = shuffle(W), gs = G.length > 3 ? shuffle(G.slice(3)).concat(sample(G.slice(0,3),1)) : shuffle(G).slice(0,2);
  return [...LS(Sx[3]), mk.build(Sx[3],Sx), ...LS(Sx[4]), mk.build(Sx[4],Sx), mk.match(ws.slice(0,5)), mk.gap(gs[0]),
    mk.type(ws[5]), mk.listen(ws[6],W), mk.rev(ws[7],W), mk.build(pickOne(Sx.slice(0,3)),Sx), ...gs.slice(1).map(mk.gap), mk.pick(ws[8],W)];
}
function buildDeck(d){
  const nw = d.w.filter(e => !known(e[0])).slice(0,8), pool = d.w, q = [];
  for (let i=0; i<nw.length; i+=2){ const a = nw[i], b = nw[i+1];
    q.push(mk.learn(a,d,'w')); if (b) q.push(mk.learn(b,d,'w')); q.push(mk.pick(a,pool)); if (b) q.push(mk.rev(b,pool)); }
  if (nw.length >= 3) q.push(mk.match(nw.slice(0,5)));
  sample(nw, Math.min(3, nw.length)).forEach((e,i) => q.push([mk.type, mk.listen, mk.type][i](e,pool)));
  return q;
}
function buildQuiz(d){

}
function buildReview(kind){
  const lang = S.lang; let keys;
  if (kind === 'daily') keys = dueKeys().slice(0,20);
  else if (kind === 'miss') keys = Object.entries(S.miss[lang]).filter(([k]) => ENTRY[lang][k]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k]) => k);
  else keys = sample(learnedKeys(), 12);
  const items = keys.map(k => ENTRY[lang][k]);
  const learnedWords = learnedKeys().map(k => ENTRY[lang][k]).filter(i => i.kind==='w').map(i => i.e);
  const pool = learnedWords.length >= 6 ? learnedWords : UNITS[lang].flatMap(u => u.w);
  const words = items.filter(i => i.kind==='w');
  const q = []; let rest = words;
  if (words.length >= 7){ q.push(mk.match(words.slice(0,5).map(i => i.e))); rest = words.slice(5); }
  rest.forEach((it,i) => q.push([mk.pick,mk.type,mk.rev,mk.listen][i%4](it.e, pool)));
  items.filter(i => i.kind==='s').forEach(it => q.push(mk.build(it.e, it.u.s)));

}

      else SFX.pair();
    } else {
      SFX.bad(); onWrong(a.v); save();
      [a.btn,b.btn].forEach(x => { x.classList.add('shake'); setTimeout(() => { x.classList.remove('shake'); x.setAttribute('aria-pressed','false'); }, 450); });
    }
  }
}
function bumpStreak(){ const t = dk(); if (S.streak.last === t) return false;
  S.streak.n = S.streak.last === dayOff(-1) ? S.streak.n + 1 : 1; S.streak.last = t; return true; }
function finish(){
  let xp; const perfect = L.err === 0;
  if (L.mode==='lesson'){ xp = 10 + (perfect ? 5 : 0); S.prog[S.lang][L.u.id] = Math.max(done(L.u), L.li + 1); }
  else { xp = Math.max(5, L.items * 2); if (L.mode==='daily') S.dailyDone[S.lang] = dk(); }
  const before = todayXp(); S.xp[dk()] = before + xp; S.total += xp; S.lessons++;
  const newDay = bumpStreak(); save(); SFX.done();
  const acc = Math.round(L.graded / (L.graded + L.err) * 100), sec = Math.round((Date.now()-L.t0)/1000);
  const goalHit = before < S.goal && S.xp[dk()] >= S.goal;
  const due = dueKeys().length;
  const score = L.graded - [...L.wrong].length;
  const msg = L.mode==='quiz' ? (score === L.graded ? 'Все ответы верные с первого раза!' : `Ошибки (${L.wrong.size}) вернутся в повторении.`)
    : goalHit ? 'Дневная цель выполнена! Можно продолжать дальше.' : newDay ? `Серия: ${S.streak.n} ${plural(S.streak.n,'день','дня','дней')} подряд.`
    : L.mode==='lesson' && due ? `На сегодня ещё ${due} ${plural(due,'карточка','карточки','карточек')} в повторении.` : 'Продолжай в том же духе.';
  $('#lesson').innerHTML = `<div class="l-body"><div class="wrap center">
    <div class="label">${L.mode==='lesson' ? esc(L.u.title) + ' · ' + STOPS[L.li] : L.deck ? esc(L.deck.title) + ' · ' + MODE[L.mode] : MODE[L.mode]}</div>
    <h2>${L.mode==='lesson' ? (perfect ? 'Урок без единой ошибки' : 'Урок пройден') : L.mode==='quiz' ? `Знаешь ${score} из ${L.graded}` : L.mode==='deck' ? 'Новые слова выучены' : 'Повторение окончено'}</h2>
    <p>${msg}</p>
    <div class="tiles"><div class="tile"><b style="color:var(--acc)">+${xp}</b><span>XP</span></div><div class="tile"><b>${acc}%</b><span>точность</span></div><div class="tile"><b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</b><span>время</span></div></div>
  </div></div><div class="l-foot"><div class="wrap" style="display:grid;gap:12px">
    ${L.mode==='lesson' && due ? '<button class="btn" data-l="todaily">Повторить сейчас</button><button class="btn ghost" data-l="close">На главную</button>' : '<button class="btn" data-l="close">Продолжить</button>'}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const sv = ev.target.closest('[data-say]'); if (sv){ say(sv.dataset.say); return; }
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if (a==='lang'){ S.lang = v; save(); render(); }
  else if (a==='tab'){ S.tab = v; save(); render(); window.scrollTo(0,0); }
  else if (a==='filter'){ S.filter[S.lang] = v; save(); render(); }
  else if (a==='wfilter'){ S.wfilter[S.lang] = v; save(); render(); }
  else if (a==='start'){ startLesson(t.dataset.u, +t.dataset.li); }
  else if (a==='daily' || a==='miss' || a==='free'){ startReview(a); }
  else if (a==='deck' || a==='quiz'){ startDeck(t.dataset.d, a==='quiz'); }
  else if (a==='abc'){ openAlpha(); }
  else if (a==='goal'){ S.goal = +v; save(); render(); }
  else if (a==='sound'){ S.sound = !S.sound; save(); t.setAttribute('aria-checked', S.sound); }
  else if (a==='sfx'){ S.sfx = !S.sfx; save(); t.setAttribute('aria-checked', S.sfx); SFX.ok(); }
  else if (a==='reset'){ sheet('Сбросить прогресс?', '<p>Удалятся пройденные уроки, изученные слова, XP, серия, ошибки и расписание повторений по всем языкам. Отменить это нельзя.</p>',
      [{label:'Сбросить', fn:() => { const k = {lang:S.lang, goal:S.goal, reminds:S.reminds, sound:S.sound, sfx:S.sfx}; S = Object.assign(JSON.parse(JSON.stringify(DEF)), k); save(); render(); }},{label:'Отмена', ghost:true}]); }
});
document.addEventListener('change', ev => { const el = ev.target;
  if (el.id && el.id.startsWith('remind') && el.value){ S.reminds[+el.dataset.i] = el.value; save(); } });
$('#lesson').addEventListener('click', ev => {
  const t = ev.target.closest('[data-l]'); if (!t) return;
  const a = t.dataset.l;
  if (a==='close'){ closeLesson(); return; }
  if (a==='todaily'){ closeLesson(); startReview('daily'); return; }
  if (a==='abc'){ const A = ALPHA[S.lang], it = A[t.dataset.k][+t.dataset.i];
    t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 900);
    sayQueue(t.dataset.k === 'letters' ? [[it[1], .8], [it[3], .85]] : [[it[3], .8], [it[3], .55]]); return; }
  if (!L) return;
  if (a==='quit'){ sheet('Выйти?', '<p>Прогресс этого урока не сохранится, но ответы уже попали в повторение.</p>',
      [{label:'Продолжить'},{label:'Выйти', ghost:true, fn:closeLesson}]); return; }
  const e = L.q[0];
  if (a==='say'){ say(e.e[0]); return; }
  if (a==='slow'){ say(e.e[0], true); return; }
  if (a==='next'){ next(); return; }
  if (a==='rule'){ const u = unitOf(e); if (u && u.rule) sheet('Правило · ' + esc(u.title), ruleHTML(u), [{label:'Понятно'}]); return; }
  if (a==='check'){ if (L.state==='ask') check(); return; }
  if (L.state !== 'ask') return;
  if (a==='sel'){ L.sel = t.dataset.v; document.querySelectorAll('.choice').forEach(c => c.setAttribute('aria-pressed', c===t?'true':'false')); setCheck(true);
    if (e.t==='gap'){ $('#blank').textContent = L.sel; }
    if (e.t==='pick' && S.sound) say(L.sel); }
  else if (a==='tok'){ L.built.push(+t.dataset.i); drawBuild(); }
  else if (a==='untok'){ L.built.splice(+t.dataset.j,1); drawBuild(); }
  else if (a==='key'){ const inp = $('#typein'); const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0,s) + t.dataset.v + inp.value.slice(en); inp.focus(); inp.setSelectionRange(s+1,s+1); setCheck(true); }
  else if (a==='hint'){ const inp = $('#typein'), tgt = e.e[0]; L.hint = Math.min(tgt.length, L.hint + 1);
    inp.value = tgt.slice(0, L.hint); setCheck(true); }
  else if (a==='mL' || a==='mR'){ matchTap(a, t.dataset.v, t); }
});
function openAlpha(){
  const A = ALPHA[S.lang], c = C();
  const tile = (k, it, i) => `<button class="abc-t ${k==='combos'?'combo':''}" data-l="abc" data-k="${k}" data-i="${i}"><b>${esc(it[0])}</b><span>${esc(it[2])}</span><small>${esc(it[3])} — ${esc(it[4])}</small></button>`;
  $('#lesson').hidden = false; document.body.classList.add('noscroll');
  $('#lesson').innerHTML = `<div class="wrap l-head"><button class="x" data-l="close" aria-label="Закрыть">${ICON.x}</button><span class="label">Алфавит · ${esc(c.name)}</span></div>
    <div class="l-body"><div class="wrap" style="display:grid;gap:14px">
      <p class="muted" style="margin:0">${A.intro} Русские буквы в скобках — примерное звучание.</p>
      <div class="abc">${A.letters.map((it,i) => tile('letters', it, i)).join('')}</div>
      <h2 class="h2" style="margin:10px 0 0">Сочетания букв</h2>
      <p class="muted" style="margin:0">Как читаются буквы вместе. Нажми — услышишь слово-пример обычно и медленно.</p>
      <div class="abc wide">${A.combos.map((it,i) => tile('combos', it, i)).join('')}</div>
    </div></div>`;
  $('#lesson .l-body').scrollTop = 0;
}
setInterval(() => { if (!L && S.tab === 'path') renderPath(); }, 5*60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !L) render(); });
if (canSpeak) try { speechSynthesis.getVoices(); } catch(e){}
render();
</script>

</body>
